<!-- Download Confirmation Modal -->
<style>
  .custom-sq-btn {
    /* 1. Create the Square Aspect Ratio */
    width: 44px;
    height: 44px;
    padding: 0;
    /* Clear padding to ensure perfect centering */

    /* 2. Center the Icon */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .icon-cheese {
    display: inline-block;
    width: 20px;
    height: 20px;
    background-color: currentColor;

    /* Apply the SVG as a mask */
    -webkit-mask: url('static/icons/cheese.svg') no-repeat center / contain;
    mask: url('static/icons/cheese.svg') no-repeat center / contain;

    /* Optional: "Brush size" hack for masks 
       This adds a tiny blur to make the icon appear slightly bolder */
    filter: drop-shadow(0 0 0.2px currentColor);
  }
</style>

<div class="modal fade" id="downloadConfirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Download</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2" id="confirm-download-only">Confirm the download before sending it to your client.</p>

        <div id="auto-organize-section">
          <p class="mt-3">Review the organization path before downloading.</p>

          <div class="mb-3">
            <label for="confirm-destination-select" class="form-label text-muted small">Destination</label>
            <select class="form-select" id="confirm-destination-select"></select>
          </div>

          <div class="mb-3">
            <label for="confirm-template-input" class="form-label mb-1">Path Template</label>
            <div class="input-group mb-2">
              <input type="text" class="form-control font-monospace" id="confirm-template-input"
                placeholder="e.g. {Author}/{Series}/{Title}">
              <button class="btn btn-outline-secondary" type="button" id="confirm-reset-template-btn"
                title="Reset to your default template"><i class="bi bi-arrow-counterclockwise"></i></button>
            </div>

            <div class="d-flex gap-2 flex-wrap">
              <span class="small text-muted align-self-center me-1">Tags:</span>
              <button type="button" class="btn btn-sm btn-outline-primary rounded-pill confirm-token-btn"
                data-token="{Author}">
                <i class="bi bi-person-fill"></i> Author
              </button>
              <button type="button" class="btn btn-sm btn-outline-primary rounded-pill confirm-token-btn"
                data-token="{Series}">
                <i class="bi bi-collection-fill"></i> Series
              </button>
              <button type="button" class="btn btn-sm btn-outline-primary rounded-pill confirm-token-btn"
                data-token="{SeriesNumber}">
                <i class="bi bi-hash"></i> Series Number
              </button>
              <button type="button" class="btn btn-sm btn-outline-primary rounded-pill confirm-token-btn"
                data-token="{Title}">
                <i class="bi bi-book-fill"></i> Title
              </button>
              <button type="button" class="btn btn-sm btn-outline-primary rounded-pill confirm-token-btn"
                data-token="{Category}">
                <i class="bi bi-collection"></i> Category
              </button>
              <button type="button" class="btn btn-sm btn-outline-primary rounded-pill confirm-token-btn"
                data-token="{Genre}">
                <i class="bi bi-tag-fill"></i> Genre
              </button>
              <button type="button" class="btn btn-sm btn-outline-primary rounded-pill confirm-token-btn"
                data-token="{Format}">
                <i class="bi bi-file-earmark-fill"></i> Format
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label for="confirm-path-input" class="form-label mb-1">Relative Path</label>
            <input type="text" class="form-control" id="confirm-path-input">
            <div class="form-text m-0" id="path-format-hint">
              Filled in from the template above. Edit it directly for a one-off path &mdash; changing the template
              rebuilds it.
            </div>
          </div>

          <div class="alert alert-light border small" role="alert" style="word-break: break-all;">
            <strong>Full Path: </strong>
            <span class="text-muted" id="confirm-destination-root">{{ ORGANIZED_PATH }}/</span><span id="full-path-preview"
              class="text-primary fw-bold"></span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <span class="d-inline-block" tabindex="0" id="use-personal-fl-tooltip-wrapper" data-bs-toggle="tooltip"
          title="Use one Freeleech Wedge when this download starts">
          <button type="button" class="btn btn-outline-warning custom-sq-btn" id="use-personal-fl-btn" disabled>
            <span class="icon-cheese"></span>
          </button>
        </span>
        <button type="button" class="btn btn-primary" id="confirm-download-btn">
          <i class="bi bi-download"></i> Start Download
        </button>
      </div>
    </div>
  </div>
</div>
